name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Named per run rather than a shared "pages" group. A shared group means a run that gets stuck
  # in the github-pages environment blocks every later run forever, and the stuck one cannot
  # always be cancelled: GitHub returned 502 on both cancel and force-cancel here. A unique group
  # lets a fresh deploy proceed past a wedged predecessor.
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
